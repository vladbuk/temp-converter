<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер Температур</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <div class="converter-card">
            <header>
                <h1>Конвертер Температур</h1>
                <p>Мгновенный перевод градусов</p>
            </header>

            <div class="input-group">
                <div class="input-wrapper">
                    <label for="celsius">Цельсий (°C)</label>
                    <input type="number" id="celsius" placeholder="0" step="any">
                </div>

                <button id="swap-btn" class="icon-exchange" aria-label="Swap units">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 10v12" />
                        <path d="M15 10.5a2.5 2.5 0 0 1 5 0v10.5a2 2 0 0 1-5 0v-10.5" />
                        <path d="M10.33 16.5a2.5 2.5 0 0 1-5 0v-8.3a4.5 4.5 0 0 1 9 0v8.3" />
                        <path d="m12 14 3-3 3 3" />
                        <path d="M12 2v4" />
                        <path d="m12 18 3 3 3-3" />
                    </svg>
                    <!-- Simple arrows icon replacement for clarity if needed, but using abstract exchange visual -->
                    <span class="exchange-symbol">⇄</span>
                </button>

                <div class="input-wrapper">
                    <label for="fahrenheit">Фаренгейт (°F)</label>
                    <input type="number" id="fahrenheit" placeholder="32" step="any">
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
