<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер Температур</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <div class="converter-card">
            <header>
                <h1>Конвертер Температур</h1>
                <p>Мгновенный перевод градусов</p>
            </header>

            <div class="input-group">
                <div class="input-wrapper">
                    <label for="celsius">Цельсий (°C)</label>
                    <input type="number" id="celsius" placeholder="0" step="any">
                </div>

                <div id="swap-btn" class="icon-exchange" role="button" tabindex="0" aria-label="Swap units">
                    <!-- Simple arrows icon replacement for clarity -->
                    <span class="exchange-symbol rotate-90">⇄</span>
                </div>

                <div class="input-wrapper">
                    <label for="fahrenheit">Фаренгейт (°F)</label>
                    <input type="number" id="fahrenheit" placeholder="32" step="any">
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
